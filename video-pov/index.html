<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"DejaVu Sans",Verdana,sans-serif;font-weight:bold}
  canvas{display:block}
  #sub{position:absolute;left:60px;right:60px;top:1235px;text-align:center;font-size:44px;line-height:1.22;
    -webkit-text-stroke:9px #17121c;paint-order:stroke fill;letter-spacing:.2px}
  #tag{position:absolute;left:50%;top:92px;transform:translateX(-50%);font-size:40px;color:#fff;background:#d5232f;
    border:5px solid #17121c;border-radius:14px;padding:8px 26px;white-space:nowrap}
  #poll{position:absolute;left:90px;right:90px;top:560px;display:none;text-align:center}
  #poll h1{font-size:76px;line-height:1.1;margin:0 0 34px;color:#fff;-webkit-text-stroke:12px #17121c;paint-order:stroke fill}
  #poll .op{font-size:50px;color:#fff;border:6px solid #17121c;border-radius:16px;padding:22px 30px;margin:0 0 22px;text-align:left;
    -webkit-text-stroke:7px #17121c;paint-order:stroke fill}
  #poll .a{background:#2f6f8f} #poll .b{background:#b3202a}
  #poll p{font-size:42px;color:#ffd84a;margin:6px 0 0;-webkit-text-stroke:8px #17121c;paint-order:stroke fill}
</style></head>
<body><div id="stage"><canvas id="gl"></canvas><div id="tag"></div><div id="sub"></div>
<div id="poll"><h1>O QUE VOCÊ FARIA?</h1><div class="op a" id="opA"></div><div class="op b" id="opB"></div><p>Comenta aqui ▼</p></div></div>
<script src="node_modules/three/build/three.min.js"></script>
<script src="engine.js"></script>
<script src="personagens.js"></script>
<script>
  const cena = new URLSearchParams(location.search).get('cena') || 'ep1';
  const carrega = (src, depois) => { const s = document.createElement('script'); s.src = src; s.onload = s.onerror = depois || null; document.body.appendChild(s); };
  carrega('falas_' + cena + '.js', () => carrega('cena_' + cena + '.js'));   // falas gravadas são opcionais
</script>
</body></html>
